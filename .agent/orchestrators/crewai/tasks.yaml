executor_request_dry_run:
  scenario: "Preparare una richiesta per Codex per valutare una futura modifica accessibile al pulsante finale Replay nel componente finale, senza modificare il repository."
  phase: "Fase 5e — CrewAI Executor Request Dry-Run"
  codex_execution_allowed: false
  merge_gate_integration: false
  repo_modification_allowed: false
  executor_response_type: no-op/example
  tasks:
    - id: plan_executor_request
      agent: request_planner
      description: Plan a no-write Executor Request for Codex.
      destructive_tools_allowed: false
      expected_phase_5e_output: Separate CrewAI task output captured in the report.

    - id: guard_scope
      agent: scope_guardian
      description: Verify forbidden files, commands, Git operations, and merge-gate changes remain disallowed.
      destructive_tools_allowed: false
      expected_phase_5e_output: Separate CrewAI task output captured in the report.

    - id: write_executor_request
      agent: executor_request_writer
      description: Write a complete markdown Executor Request according to the Fase 5e contract.
      destructive_tools_allowed: false
      expected_phase_5e_output: Structured Executor Request captured as evidence.

    - id: review_contract
      agent: contract_reviewer
      description: Review the Executor Request against required contract fields and safety constraints.
      destructive_tools_allowed: false
      expected_phase_5e_output: Contract review notes captured in the report.

    - id: aggregate_verdict
